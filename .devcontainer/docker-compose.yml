services:
  backend:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    container_name: crypto-taxes-backend-dev
    volumes:
      - ..:/workspace:cached
      - crypto_data_dev:/app/persistent_data
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=development
      - FLASK_RUN_HOST=0.0.0.0
      - FLASK_RUN_PORT=5000
      - DATABASE_URL=postgresql+psycopg2://cryptotaxes:cryptotaxes@postgres:5432/cryptotaxes
      - PYTHONPATH=/workspace/backend
    ports:
      - "5000:5000"
    networks:
      - crypto-network
    depends_on:
      - postgres
    command: sleep infinity
    stdin_open: true
    tty: true

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: crypto-taxes-frontend-dev
    volumes:
      - ../frontend:/app:cached
      - /app/node_modules
    environment:
      - REACT_APP_API_URL=http://backend:5000
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    ports:
      - "3000:3000"
    networks:
      - crypto-network
    depends_on:
      - backend
    command: sleep infinity
    stdin_open: true
    tty: true

  postgres:
    image: postgres:16-alpine
    container_name: crypto-taxes-postgres-dev
    environment:
      - POSTGRES_DB=cryptotaxes
      - POSTGRES_USER=cryptotaxes
      - POSTGRES_PASSWORD=cryptotaxes
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - crypto-network
    restart: unless-stopped

volumes:
  crypto_data_dev:
    driver: local
  postgres_data_dev:
    driver: local

networks:
  crypto-network:
    driver: bridge
