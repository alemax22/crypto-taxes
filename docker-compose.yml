services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crypto-taxes-backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - crypto_data:/app/persistent_data
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=production
      - FLASK_RUN_HOST=0.0.0.0
      - FLASK_RUN_PORT=5000
      - DATABASE_URL=postgresql+psycopg2://cryptotaxes:cryptotaxes@postgres:5432/cryptotaxes
    networks:
      - crypto-network
    depends_on:
      - postgres
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crypto-taxes-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - REACT_APP_API_URL=http://backend:5000
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    networks:
      - crypto-network
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:16-alpine
    container_name: crypto-taxes-postgres
    environment:
      - POSTGRES_DB=cryptotaxes
      - POSTGRES_USER=cryptotaxes
      - POSTGRES_PASSWORD=cryptotaxes
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - crypto-network
    restart: unless-stopped

volumes:
  crypto_data:
    driver: local
  postgres_data:
    driver: local

networks:
  crypto-network:
    driver: bridge 